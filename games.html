<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Мои любимые игрушки...</title>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet" />
    <style>
        /* ——— все стили без изменений ——— */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        *:focus {
            outline: none;
        }
        *:focus-visible {
            outline: 2px solid #ff0033;
            outline-offset: 2px;
            border-radius: 6px;
        }
        ::selection {
            background: #ff0033;
            color: #fff;
        }
        html,
        body {
            background: #000;
        }
        body {
            min-height: 100vh;
            color: #f5f5f5;
            font-family: 'Manrope', system-ui, sans-serif;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 60px 20px;
        }
        .wrapper {
            width: 100%;
            max-width: 640px;
        }
        h1 {
            font-size: clamp(28px, 5vw, 42px);
            font-weight: 800;
            letter-spacing: -0.02em;
            margin-bottom: 8px;
            color: #fff;
        }
        h1 .accent {
            color: #ff0033;
        }
        .subtitle {
            color: #8a8a8a;
            font-size: 14px;
            margin-bottom: 36px;
        }
        ul.list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .item {
            position: relative;
            isolation: isolate;
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 18px 20px;
            background-color: transparent;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            border: 1px solid #000;
            border-radius: 14px;
            overflow: hidden;
            transition: transform .25s ease, box-shadow .25s ease, border-color .25s ease;
        }
        .item:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
        }
        .item.has-bg::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, rgba(0, 0, 0, 0.78) 0%, rgba(0, 0, 0, 0.55) 60%, rgba(0, 0, 0, 0.35) 100%);
            z-index: 0;
            pointer-events: none;
        }
        .item>* {
            position: relative;
            z-index: 1;
        }
        .num {
            color: #ff0033;
            font-weight: 800;
            font-size: 18px;
            min-width: 24px;
        }
        .item a.title {
            color: #f5f5f5;
            text-decoration: none;
            font-size: 17px;
            font-weight: 600;
            flex: 1;
            transition: color .2s ease;
        }
        .item a.title:hover {
            color: #ff0033;
        }

        /* ——— сердце ——— */
        .heart-container {
            --heart-color: #ff0033;
            position: relative;
            width: 38px;
            height: 38px;
            flex-shrink: 0;
            transition: .3s;
        }
        .heart-container .checkbox {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            z-index: 20;
            cursor: pointer;
        }
        .heart-container .svg-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        .heart-container .svg-outline {
            fill: var(--heart-color);
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
        }
        .heart-container .svg-pulse {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: none;
            overflow: visible;
        }
        .heart-container .svg-pulse path {
            fill: none;
            stroke-width: 3;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .heart-container .svg-pulse .back {
            stroke: #ff003333;
        }
        .heart-container .svg-pulse .front {
            stroke: #ff0033;
            stroke-dasharray: 20, 60;
            stroke-dashoffset: 80;
            animation: heart-dash 1.4s linear infinite;
            filter: drop-shadow(0 0 4px #ff0033);
        }
        @keyframes heart-dash {
            72.5% {
                opacity: 0;
            }
            to {
                stroke-dashoffset: 0;
            }
        }
        .heart-container .svg-celebrate {
            position: absolute;
            animation: celebrate .5s;
            animation-fill-mode: forwards;
            display: none;
            stroke: var(--heart-color);
            fill: var(--heart-color);
            stroke-width: 2px;
        }
        @keyframes celebrate {
            0% {
                transform: scale(0);
            }
            50% {
                opacity: 1;
                filter: brightness(1.5);
            }
            100% {
                transform: scale(1.4);
                opacity: 0;
                display: none;
            }
        }
        .heart-container .checkbox:checked~.svg-container .svg-outline {
            display: none;
        }
        .heart-container .checkbox:checked~.svg-container .svg-pulse {
            display: block;
        }
        .heart-container .checkbox:checked~.svg-container .svg-celebrate {
            display: block;
        }

        footer {
            text-align: center;
            margin-top: 40px;
            color: #555;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <h1>Мои любимые <span class="accent">игрушки</span>...</h1>

        <!-- =========================================================
             РЕДАКТИРУЙ СПИСОК ПРЯМО ЗДЕСЬ ↓
             - Копируй/вставляй <li class="item"> ... </li>
             - Для фона добавь класс "has-bg" и style="background-image: url('...')"
             - Номера и сердечки проставятся автоматически
             ========================================================= -->
        <ul class="list" id="gameList">
            <li class="item has-bg" style="background-image: url('https://avatars.mds.yandex.net/i?id=8d613977dd8b90e6e93d3a1d3ede515a_l-10907882-images-thumbs&amp;n=13');">
                <a class="title" href="https://telegra.ph/Summertime-Saga-08-18" target="_blank" rel="noopener">Summertime Saga</a>
            </li>
            <li class="item has-bg" style="background-image: url('https://gamefabrique.ru/i/pc/rick-and-morty-another-way-home.png');">
                <a class="title" href="https://telegra.ph/Rick-and-Morty-Another-Way-Home-08-18" target="_blank" rel="noopener">Rick and Morty: Another Way Home</a>
            </li>
            <li class="item has-bg" style="background-image: url('https://avatars.mds.yandex.net/i?id=2706cf12f303914f6a02a6f42a4bfd00d73ef5e2-10638736-images-thumbs&n=13');">
                <a class="title" href="https://t.me/shadik_ru" target="_blank" rel="noopener">Hornycraft</a>
            </li>
            <!-- Добавляй новые игры сюда -->
        </ul>
    </div>

    <!-- ——— шаблон сердца (один раз, не трогай) ——— -->
    <template id="heartTemplate">
        <label class="heart-container" title="Like">
            <input type="checkbox" class="checkbox" checked />
            <div class="svg-container">
                <svg viewBox="0 0 24 24" class="svg-outline" xmlns="http://www.w3.org/2000/svg">
                    <path d="M17.5,1.917a6.4,6.4,0,0,0-5.5,3.3,6.4,6.4,0,0,0-5.5-3.3A6.8,6.8,0,0,0,0,8.967c0,4.547,4.786,9.513,8.8,12.88a5,5,0,0,0,6.4,0C19.214,18.48,24,13.514,24,8.967A6.8,6.8,0,0,0,17.5,1.917Zm-3.585,18.4a3,3,0,0,1-3.83,0C4.947,16.006,2,11.87,2,8.967A4.8,4.8,0,0,1,6.5,3.917a4.8,4.8,0,0,1,4.5,5.05,1,1,0,0,0,2,0,4.8,4.8,0,0,1,4.5-5.05,4.8,4.8,0,0,1,4.5,5.05C22,11.87,19.053,16.006,13.915,20.313Z"/>
                </svg>
                <svg viewBox="0 0 24 24" class="svg-pulse" xmlns="http://www.w3.org/2000/svg">
                    <path class="back" d="M12,21.35 C7,17.5 2,13.5 2,8.5 A5,5 0 0 1 12,6 A5,5 0 0 1 22,8.5 C22,13.5 17,17.5 12,21.35 Z"/>
                    <path class="front" d="M12,21.35 C7,17.5 2,13.5 2,8.5 A5,5 0 0 1 12,6 A5,5 0 0 1 22,8.5 C22,13.5 17,17.5 12,21.35 Z"/>
                </svg>
                <svg class="svg-celebrate" width="100" height="100" xmlns="http://www.w3.org/2000/svg">
                    <polygon points="10,10 20,20"/>
                    <polygon points="10,50 20,50"/>
                    <polygon points="20,80 30,70"/>
                    <polygon points="90,10 80,20"/>
                    <polygon points="90,50 80,50"/>
                    <polygon points="80,80 70,70"/>
                </svg>
            </div>
        </label>
    </template>

    <script>
        // Автоматически добавляем номер и сердце в каждый пункт списка
        document.querySelectorAll('#gameList .item').forEach((item, index) => {
            // Номер (ставим перед ссылкой)
            const numSpan = document.createElement('span');
            numSpan.className = 'num';
            numSpan.textContent = (index + 1) + '.';
            item.prepend(numSpan); // вставляем в начало

            // Сердце (клонируем из шаблона и добавляем в конец)
            const heartClone = document.getElementById('heartTemplate').content.cloneNode(true);
            item.appendChild(heartClone);
        });
    </script>
</body>
</html>
